<style>
  :root{
    --navy-950:#060a1c;
    --navy-900:#0d1530;
    --navy-800:#141d40;
    --navy-700:#1c274f;
    --navy-600:#283260;
    --gold-500:#c9a34e;
    --gold-400:#d9b869;
    --gold-300:#e7cd8b;
    --cream:#f4efe2;
    --slate:#8a92b8;
    --slate-dim:#5d6690;
    --divider:rgba(201,163,78,0.16);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#02040c;
    font-family:'Manrope',sans-serif;
    color:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    width:100%;
    max-width:600px;
    margin:0 auto;
    background:var(--navy-900);
    position:relative;
  }

  .topbar{
    padding:6px 22px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .crest{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(160deg,var(--gold-300),var(--gold-500) 60%,#8a6a26);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:17px;
    color:var(--navy-950);
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.02em;
    line-height:1.1;
  }
  .brand-sub{
    font-size:10.5px;
    color:var(--slate);
    margin-top:1px;
  }
  .table-chip{
    font-size:11px;
    color:var(--gold-300);
    background:rgba(201,163,78,0.12);
    border:1px solid var(--divider);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  .switcher{
    margin:2px 22px 14px;
    background:var(--navy-800);
    border-radius:16px;
    padding:5px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    flex-shrink:0;
  }
  .switch-btn{
    border:none;
    background:transparent;
    color:var(--slate);
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 0;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .switch-btn svg{width:17px;height:17px;flex-shrink:0;}
  .switch-btn.active{
    background:linear-gradient(160deg,var(--gold-400),var(--gold-500));
    color:var(--navy-950);
  }
  .switch-btn:not(.active):hover{color:var(--cream);}

  .searchwrap{
    margin:0 22px 12px;
    position:relative;
    flex-shrink:0;
  }
  .searchwrap input{
    width:100%;
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    border-radius:12px;
    padding:11px 14px 11px 38px;
    color:var(--cream);
    font-family:'Manrope',sans-serif;
    font-size:13.5px;
  }
  .searchwrap input::placeholder{color:var(--slate-dim);}
  .searchwrap input:focus{outline:none;border-color:var(--gold-500);}
  .searchwrap svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--slate);
  }
  .search-clear{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;background:var(--navy-700);
    color:var(--slate);border:none;font-size:12px;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }

  .chiprow{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 22px 14px;
    flex-shrink:0;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:8px 15px;
    border-radius:999px;
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    color:var(--slate);
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{
    background:rgba(201,163,78,0.14);
    border-color:var(--gold-500);
    color:var(--gold-300);
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:2px 22px 26px;
  }
  .content::-webkit-scrollbar{width:4px;}
  .content::-webkit-scrollbar-thumb{background:var(--navy-700);border-radius:4px;}

  .section-head{
    display:flex;
    align-items:baseline;
    gap:9px;
    margin:22px 0 10px;
  }
  .section-head:first-child{margin-top:6px;}
  .section-bar{width:3px;height:15px;background:var(--gold-500);border-radius:2px;flex-shrink:0;}
  .section-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:16.5px;
    color:var(--cream);
  }
  .section-note{
    font-size:10.5px;
    color:var(--slate-dim);
    margin:-4px 0 10px 12px;
  }

  .card{
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    border-radius:var(--radius-md);
    padding:13px 15px;
    margin-bottom:9px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .item-name{
    font-size:14px;
    font-weight:700;
    color:var(--cream);
    line-height:1.35;
  }
  .item-price{
    font-size:14px;
    font-weight:700;
    color:var(--gold-300);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .item-desc{
    font-size:12px;
    color:var(--slate);
    line-height:1.5;
    margin-top:4px;
  }
  .item-tag{
    display:inline-block;
    margin-top:7px;
    font-size:10px;
    font-weight:700;
    color:var(--gold-400);
    background:rgba(201,163,78,0.1);
    padding:3px 8px;
    border-radius:6px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--slate-dim);
    font-size:13px;
  }

  .quickbar{
    flex-shrink:0;
    padding:10px 22px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    gap:8px;
    background:linear-gradient(180deg,transparent,var(--navy-950) 40%);
    border-top:1px solid var(--divider);
  }
  .quickbar button{
    flex:1;
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    color:var(--cream);
    font-family:'Manrope',sans-serif;
    font-size:12px;
    font-weight:700;
    padding:11px 0;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
  }
  .quickbar svg{width:15px;height:15px;}
  .quickbar .primary{
    background:linear-gradient(160deg,var(--gold-400),var(--gold-500));
    color:var(--navy-950);
    border:none;
  }

</style>

function fmt(p){
  if(p === null || p === undefined) return "consulte";
  return p.toLocaleString('de-DE') + ' Kz';
}
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'); }

function renderChips(){
  const cats = DATA[activeMenu];
  chipRow.innerHTML = cats.map(c => {
    const id = slug(c.cat);
    const isActive = activeCat === id;
    return '<div class="chip'+(isActive?' active':'')+'" data-target="'+id+'">'+c.cat+'</div>';
  }).join('');
  chipRow.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const target = document.getElementById('sec-'+chip.dataset.target);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderList(){
  const cats = DATA[activeMenu];
  contentEl.innerHTML = cats.map(c => {
    const id = slug(c.cat);
    const note = c.note ? '<div class="section-note">'+c.note+'</div>' : '';
    const items = c.items.length ? c.items.map(it => {
      const qs = `?n=${encodeURIComponent(it.n)}&p=${encodeURIComponent(it.p)}&d=${encodeURIComponent(it.d||'')}&cat=${encodeURIComponent(c.cat)}`;
      return '<div class="card" style="cursor:pointer" onclick="window.location.href=\'detalhes.html'+qs+'\'"><div class="card-top"><div class="item-name">'+it.n+'</div><div class="item-price">'+fmt(it.p)+'</div></div>'
      + (it.d ? '<div class="item-desc">'+it.d+'</div>' : '')
      + '</div>';
    }).join('') : '';
    return '<div class="section" id="sec-'+id+'"><div class="section-head"><div class="section-bar"></div><div class="section-title">'+c.cat+'</div></div>'+note+items+'</div>';
  }).join('');
  setupScrollSpy();
}

function renderSearch(term){
  const cats = DATA[activeMenu];
  const t = term.trim().toLowerCase();
  let matches = [];
  cats.forEach(c=>{
    c.items.forEach(it=>{
      const hay = (it.n+' '+(it.d||'')).toLowerCase();
      if(hay.includes(t)) matches.push({cat:c.cat, it});
    });
  });
  if(matches.length === 0){
    contentEl.innerHTML = '<div class="empty">Sem resultados para "'+term+'"<br>tente outra palavra</div>';
    return;
  }
  contentEl.innerHTML = matches.map(m => {
    const qs = `?n=${encodeURIComponent(m.it.n)}&p=${encodeURIComponent(m.it.p)}&d=${encodeURIComponent(m.it.d||'')}&cat=${encodeURIComponent(m.cat)}`;
    return '<div class="card" style="cursor:pointer" onclick="window.location.href=\'detalhes.html'+qs+'\'"><div class="card-top"><div class="item-name">'+m.it.n+'</div><div class="item-price">'+fmt(m.it.p)+'</div></div>'
    + (m.it.d ? '<div class="item-desc">'+m.it.d+'</div>' : '')
    + '<div class="item-tag">'+m.cat+'</div></div>';
  }).join('');
}

let observer = null;
function setupScrollSpy(){
  if(observer) observer.disconnect();
  const sections = document.querySelectorAll('.section');
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id.replace('sec-','');
        activeCat = id;
        chipRow.querySelectorAll('.chip').forEach(chip=>{
          chip.classList.toggle('active', chip.dataset.target === id);
        });
        const activeChip = chipRow.querySelector('.chip.active');
        if(activeChip) activeChip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      }
    });
  }, { root: contentEl, threshold: 0, rootMargin: '-10% 0px -75% 0px' });
  sections.forEach(s => observer.observe(s));
}

function switchMenu(menu){
  activeMenu = menu;
  activeCat = null;
  searchInput.value = '';
  searchClear.style.display = 'none';
  document.querySelectorAll('.switch-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.menu === menu);
  });
  renderChips();
  renderList();
  contentEl.scrollTop = 0;
}

document.querySelectorAll('.switch-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchMenu(btn.dataset.menu));
});

searchInput.addEventListener('input', (e)=>{
  const val = e.target.value;
  searchClear.style.display = val ? 'flex' : 'none';
  if(val.trim()){
    chipRow.style.visibility = 'hidden';
    renderSearch(val);
  } else {
    chipRow.style.visibility = 'visible';
    renderList();
  }
});
searchClear.addEventListener('click', ()=>{
  searchInput.value = '';
  searchClear.style.display = 'none';
  chipRow.style.visibility = 'visible';
  renderList();
  searchInput.focus();
});

document.getElementById('topBtn').addEventListener('click', ()=>{
  contentEl.scrollTo({top:0, behavior:'smooth'});
});

const params = new URLSearchParams(window.location.search);
const mesa = params.get('mesa');
if(mesa) document.getElementById('tableChip').textContent = 'Mesa ' + mesa;

renderChips();
renderList();
</script>
</body>
</html>
